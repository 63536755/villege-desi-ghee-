/* 3D ANIMATIONS */
@keyframes float3d {
  0%   { transform: perspective(1000px) rotateY(0deg) rotateX(0deg) translateY(0); }
  25%  { transform: perspective(1000px) rotateY(5deg) rotateX(3deg) translateY(-10px); }
  50%  { transform: perspective(1000px) rotateY(0deg) rotateX(0deg) translateY(-18px); }
  75%  { transform: perspective(1000px) rotateY(-5deg) rotateX(-3deg) translateY(-10px); }
  100% { transform: perspective(1000px) rotateY(0deg) rotateX(0deg) translateY(0); }
}

@keyframes spin3d {
  0%   { transform: perspective(800px) rotateY(0deg); }
  100% { transform: perspective(800px) rotateY(360deg); }
}

@keyframes pulse3d {
  0%,100% { transform: perspective(600px) scale(1) rotateZ(0deg); box-shadow: 0 20px 60px rgba(196,122,42,0.3); }
  50%      { transform: perspective(600px) scale(1.04) rotateZ(1deg); box-shadow: 0 35px 80px rgba(196,122,42,0.55); }
}

@keyframes slideIn3d {
  from { transform: perspective(1000px) rotateY(-25deg) translateX(-60px); opacity: 0; }
  to   { transform: perspective(1000px) rotateY(0deg) translateX(0); opacity: 1; }
}

@keyframes badge3d {
  0%,100% { transform: perspective(400px) rotateX(0deg) translateY(0); }
  50%      { transform: perspective(400px) rotateX(10deg) translateY(-5px); }
}

@keyframes textGlow {
  0%,100% { text-shadow: 0 0 20px rgba(196,122,42,0.3); }
  50%      { text-shadow: 0 0 40px rgba(196,122,42,0.7), 0 0 80px rgba(196,122,42,0.3); }
}

@keyframes rotateGlow {
  0%   { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.slide-img {
  animation: float3d 5s ease-in-out infinite !important;
  transform-style: preserve-3d;
}

.slide h1 {
  animation: slideIn3d 1s ease both, textGlow 3s ease-in-out infinite;
}

.slide-price {
  animation: badge3d 3s ease-in-out infinite !important;
  transform-style: preserve-3d;
}

.slide-btn {
  transition: all 0.4s !important;
  transform-style: preserve-3d;
}
.slide-btn:hover {
